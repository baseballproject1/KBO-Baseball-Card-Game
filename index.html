<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBO Baseball Card Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>KBO Baseball Card Game</h1>

    <div class="info">
        <span id="teamName">팀 없음</span>
        <span id="money">자금 100억</span>
    </div>
</header>


<main>

<!-- 팀 선택 -->
<section id="teamSection" class="box">

<h2>구단 선택</h2>

<select id="teamSelect">

<option value="SSG">SSG Landers</option>
<option value="Samsung">Samsung Lions</option>
<option value="LG">LG Twins</option>
<option value="Doosan">Doosan Bears</option>
<option value="KIA">KIA Tigers</option>
<option value="KT">KT Wiz</option>
<option value="Lotte">Lotte Giants</option>
<option value="Hanwha">Hanwha Eagles</option>
<option value="Kiwoom">Kiwoom Heroes</option>
<option value="NC">NC Dinos</option>

</select>

<button onclick="selectTeam()">Select Team</button>

</section>



<!-- 메인 메뉴 -->
<section class="menu box">

<h2>Main Menu</h2>

<button onclick="startGame()">
⚾ Game
</button>

<button onclick="openRoster()">
👥 Roster
</button>

<button onclick="openGacha()">
🎴 Gacha
</button>

<button onclick="openFA()">
🤝 FA
</button>

<button onclick="openTrade()">
🔄 Trade
</button>

<button onclick="openShop()">
🛒 Shop
</button>

<button onclick="openEnhance()">
🔥 Enhance
</button>

<button onclick="openLegend()">
👑 Legend Craft
</button>

<button onclick="openTutorial()">
📖 Tutorial
</button>

</section>



<!-- 게임 화면 -->
<section id="gameSection" class="box">

<h2>Game</h2>

<div id="stadium">
Stadium
</div>


<div class="gameButtons">

<button onclick="pitch()">
Pitch
</button>

<button onclick="swing()">
Swing
</button>

</div>


<div id="gameMessage">
Game Ready
</div>


<div id="scoreBoard">

Home 0 : 0 Away

</div>


</section>



<!-- 선수 정보 -->
<section id="playerSection" class="box">

<h2>Player Information</h2>

<div id="playerList">

선수 목록

</div>

</section>



<!-- 아이템 -->
<section id="itemSection" class="box">

<h2>Items</h2>

<div id="itemList">

아이템 목록

</div>

</section>


</main>



<!-- JS 연결 -->

<script src="js/players.js"></script>
<script src="js/teams.js"></script>

<script src="js/items.js"></script>
<script src="js/shop.js"></script>

<script src="js/gacha.js"></script>

<script src="js/fa.js"></script>
<script src="js/trade.js"></script>

<script src="js/enhance.js"></script>
<script src="js/legend.js"></script>

<script src="js/game.js"></script>

<script src="js/save.js"></script>
<script src="js/tutorial.js"></script>


</body>
</html>
