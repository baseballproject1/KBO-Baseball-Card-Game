<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KBO CARD GAME</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>⚾ KBO CARD GAME</h1>

</header>



<section class="info">


<h2>내 구단</h2>

<div id="team">
팀 없음
</div>



<h2>보유 금액</h2>

<div id="money">
100억
</div>



<h2 id="stage">
스테이지 1
</h2>



<h2 id="season">
시즌 경기 0 / 144
</h2>


</section>





<section class="team-select">


<h2>팀 선택</h2>


<button onclick="selectTeam('SSG 랜더스')">
SSG 랜더스
</button>


<button onclick="selectTeam('삼성 라이온즈')">
삼성 라이온즈
</button>


<button onclick="selectTeam('LG 트윈스')">
LG 트윈스
</button>


<button onclick="selectTeam('두산 베어스')">
두산 베어스
</button>


<button onclick="selectTeam('KIA 타이거즈')">
KIA 타이거즈
</button>


<button onclick="selectTeam('KT 위즈')">
KT 위즈
</button>


<button onclick="selectTeam('롯데 자이언츠')">
롯데 자이언츠
</button>


<button onclick="selectTeam('한화 이글스')">
한화 이글스
</button>


<button onclick="selectTeam('키움 히어로즈')">
키움 히어로즈
</button>


<button onclick="selectTeam('NC 다이노스')">
NC 다이노스
</button>



</section>






<section class="gacha">


<h2>뽑기</h2>


<button onclick="normalDraw()">
⚪ 일반 뽑기
</button>


<button onclick="premiumDraw()">
🔥 고급 뽑기
</button>



</section>







<section class="league">


<h2>리그 경기</h2>



<button onclick="playLeague('attack')">
⚾ 공격만
</button>



<button onclick="playLeague('defense')">
🧤 수비만
</button>



<button onclick="playLeague('all')">
🔥 전체 플레이
</button>



</section>







<section class="save">


<h2>저장</h2>



<button onclick="saveButton(1)">
저장 1
</button>


<button onclick="saveButton(2)">
저장 2
</button>


<button onclick="saveButton(3)">
저장 3
</button>


<button onclick="saveButton(4)">
저장 4
</button>


<button onclick="saveButton(5)">
저장 5
</button>



<h2>불러오기</h2>



<button onclick="loadButton(1)">
불러오기 1
</button>


<button onclick="loadButton(2)">
불러오기 2
</button>


<button onclick="loadButton(3)">
불러오기 3
</button>


<button onclick="loadButton(4)">
불러오기 4
</button>


<button onclick="loadButton(5)">
불러오기 5
</button>



</section>







<section class="cards">


<h2>보유 카드</h2>


<div id="cardList">

아직 카드가 없습니다.

</div>



</section>








<!-- 데이터 -->

<script src="js/players.js"></script>

<script src="js/teams.js"></script>



<!-- 시스템 -->

<script src="js/save.js"></script>

<script src="js/gacha.js"></script>

<script src="js/enhance.js"></script>

<script src="js/legend.js"></script>

<script src="js/shopitems.js"></script>

<script src="js/game.js"></script>



<!-- 화면 연결 -->

<script src="script.js"></script>



</body>

</html>
